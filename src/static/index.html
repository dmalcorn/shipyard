<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factory Relay — Command Bridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
<style>
/* ── Reset & Root ── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-hull: #0a0c10;
  --bg-plate: #12151c;
  --bg-panel: #181c26;
  --bg-input: #0e1118;
  --border-weld: #2a2f3e;
  --border-glow: #3d4560;
  --amber: #e8a830;
  --amber-dim: #b8842a;
  --amber-glow: rgba(232, 168, 48, 0.15);
  --green-ok: #34d399;
  --green-glow: rgba(52, 211, 153, 0.12);
  --red-alert: #f87171;
  --red-glow: rgba(248, 113, 113, 0.12);
  --blue-data: #60a5fa;
  --blue-glow: rgba(96, 165, 250, 0.1);
  --text-primary: #e2e5ec;
  --text-secondary: #8891a5;
  --text-dim: #555d72;
  --font-display: 'Outfit', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --radius: 6px;
  --transition: 180ms ease;
}

html { font-size: 15px; }

body {
  font-family: var(--font-mono);
  background: var(--bg-hull);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(232, 168, 48, 0.04), transparent),
    repeating-linear-gradient(0deg, transparent, transparent 60px, rgba(42, 47, 62, 0.15) 60px, rgba(42, 47, 62, 0.15) 61px),
    repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(42, 47, 62, 0.08) 60px, rgba(42, 47, 62, 0.08) 61px);
}

/* ── Header ── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.2rem 2rem;
  border-bottom: 1px solid var(--border-weld);
  background: linear-gradient(180deg, rgba(18, 21, 28, 0.95), rgba(10, 12, 16, 0.98));
  backdrop-filter: blur(12px);
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 1.6rem;
  letter-spacing: -0.02em;
  color: var(--amber);
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 0.6rem;
}

.logo-icon {
  width: 28px;
  height: 28px;
  border: 2px solid var(--amber);
  border-radius: 3px;
  display: grid;
  place-items: center;
  font-size: 0.85rem;
  transform: rotate(-5deg);
}

.header-status {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
  padding: 0 1.5rem;
  font-family: var(--font-display);
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
}

.header-status.empty { color: var(--text-dim); font-style: italic; }

.header-status .epic-tag {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 0.2rem 0.55rem;
  border-radius: 3px;
  background: var(--amber-glow);
  color: var(--amber);
  border: 1px solid var(--amber-dim);
  flex-shrink: 0;
}

.header-status .story-text {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text-primary);
  font-weight: 600;
}

.header-status .story-text .story-id {
  color: var(--amber);
  font-weight: 700;
  margin-right: 0.4rem;
}

@media (max-width: 900px) {
  .header-status { display: none; }
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-shrink: 0;
}

.health-badge {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 0.35rem 0.8rem;
  border-radius: 20px;
  border: 1px solid var(--border-weld);
  background: var(--bg-plate);
  transition: all var(--transition);
}

.health-badge.ok { border-color: var(--green-ok); background: var(--green-glow); color: var(--green-ok); }
.health-badge.error { border-color: var(--red-alert); background: var(--red-glow); color: var(--red-alert); }
.health-badge.checking { color: var(--text-dim); }

.health-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--text-dim);
  transition: all var(--transition);
}

.health-badge.ok .health-dot { background: var(--green-ok); box-shadow: 0 0 8px var(--green-ok); }
.health-badge.error .health-dot { background: var(--red-alert); box-shadow: 0 0 8px var(--red-alert); }
.health-badge.checking .health-dot { background: var(--text-dim); animation: pulse-dim 1.2s ease infinite; }

.live-badge {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 0.35rem 0.8rem;
  border-radius: 20px;
  border: 1px solid var(--amber);
  background: var(--amber-glow);
  color: var(--amber);
  animation: live-pulse 2s ease infinite;
  display: none;
}

.live-badge.active { display: flex; }

.live-badge .live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--amber);
  box-shadow: 0 0 8px var(--amber);
}

@keyframes live-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

@keyframes pulse-dim {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

/* ── Layout ── */
.bridge {
  display: flex;
  flex-direction: column;
  gap: 1px;
  max-width: 1400px;
  margin: 1.5rem auto;
  padding: 0 1.5rem;
}

/* ── Panels ── */
.panel {
  background: var(--bg-plate);
  border: 1px solid var(--border-weld);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: border-color var(--transition);
}

.panel:hover { border-color: var(--border-glow); }

.panel-header {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.8rem 1.1rem;
  border-bottom: 1px solid var(--border-weld);
  background: var(--bg-panel);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-secondary);
}

.panel-header .tag {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  font-weight: 600;
  padding: 0.15rem 0.45rem;
  border-radius: 3px;
  letter-spacing: 0.05em;
}

.tag-live { background: var(--amber-glow); color: var(--amber); }
.tag-replay { background: var(--blue-glow); color: var(--blue-data); }

.panel-header .spacer { flex: 1; }

.panel-body { padding: 1.1rem; flex: 1; }

/* ── Session Picker ── */
.session-picker {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.session-select {
  background: var(--bg-input);
  border: 1px solid var(--border-weld);
  border-radius: var(--radius);
  padding: 0.3rem 0.6rem;
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 0.7rem;
  outline: none;
  cursor: pointer;
  min-width: 220px;
}

.session-select:focus { border-color: var(--amber); }

/* ── Terminal Viewer ── */
.terminal {
  background: var(--bg-input);
  border: 1px solid var(--border-weld);
  border-radius: var(--radius);
  padding: 0.9rem;
  min-height: 500px;
  max-height: 70vh;
  overflow-y: auto;
  font-size: 0.78rem;
  line-height: 1.7;
  color: var(--text-secondary);
  scroll-behavior: smooth;
  white-space: pre-wrap;
  word-break: break-word;
}

.terminal::-webkit-scrollbar { width: 5px; }
.terminal::-webkit-scrollbar-track { background: transparent; }
.terminal::-webkit-scrollbar-thumb { background: var(--border-weld); border-radius: 3px; }

.terminal .line { display: block; }
.terminal .line-log { color: var(--text-secondary); }
.terminal .line-stage { color: var(--amber); font-weight: 700; }
.terminal .line-error { color: var(--red-alert); }
.terminal .line-success { color: var(--green-ok); }
.terminal .line-info { color: var(--blue-data); }

.terminal-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 300px;
  color: var(--text-dim);
  font-style: italic;
  font-size: 0.85rem;
}

/* ── Spinner ── */
.spinner {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid var(--border-weld);
  border-top-color: var(--amber);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  vertical-align: middle;
  margin-right: 0.3rem;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ── Progress Card ── */
.panel-progress { margin-top: 0.5rem; }

.progress-position {
  font-family: var(--font-display);
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 0.6rem;
  min-height: 1.4em;
}

/* ── Progress Meta ── */
.progress-meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-top: 0.6rem;
  font-size: 0.7rem;
  letter-spacing: 0.05em;
  color: var(--text-secondary);
}

.progress-meta .meta-count {
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--text-primary);
}

.progress-meta .meta-elapsed {
  font-family: var(--font-mono);
  color: var(--text-dim);
}

.progress-bar {
  width: 100%;
  height: 6px;
  background: var(--bg-input);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 0.5rem;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--amber-dim), var(--amber));
  border-radius: 3px;
  width: 0%;
  transition: width 0.5s ease;
}

/* ── Responsive ── */
@media (max-width: 900px) {
  .progress-meta { flex-wrap: wrap; gap: 0.4rem; }
}
</style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo">
    <div class="logo-icon">&#9875;</div>
    Factory Relay
  </div>
  <div class="header-status empty" id="headerStatus">No active pipeline</div>
  <div class="header-controls">
    <div class="live-badge" id="liveBadge">
      <div class="live-dot"></div>
      <span>LIVE</span>
    </div>
    <div class="health-badge checking" id="healthBadge">
      <div class="health-dot"></div>
      <span id="healthText">Checking...</span>
    </div>
  </div>
</header>

<!-- Main Content -->
<div class="bridge">

  <!-- Pipeline Progress -->
  <div class="panel panel-progress">
    <div class="panel-header">
      Pipeline Progress
      <span class="tag tag-live">LIVE</span>
      <div class="spacer"></div>
    </div>
    <div class="panel-body">
      <div class="progress-position" id="progressPosition">Waiting for pipeline...</div>
      <div class="progress-bar"><div class="progress-fill" id="rebuildProgress"></div></div>
      <div class="progress-meta">
        <span class="meta-count" id="progressCount">&mdash;</span>
        <span class="meta-elapsed" id="progressElapsed">&mdash;</span>
      </div>
    </div>
  </div>

  <!-- Terminal Panel -->
  <div class="panel">
    <div class="panel-header">
      Pipeline Output
      <span class="tag tag-live" id="modeTag">LIVE</span>
      <div class="spacer"></div>
      <div class="session-picker">
        <select class="session-select" id="sessionSelect">
          <option value="">-- select session --</option>
        </select>
      </div>
    </div>
    <div class="panel-body" style="padding:0;">
      <div class="terminal" id="terminal">
        <div class="terminal-empty" id="terminalEmpty">No active pipeline. Select a past session to replay.</div>
      </div>
    </div>
  </div>

</div>

<script>
const API = window.location.origin;

// ── State ──
let currentMode = 'idle';     // 'idle' | 'live' | 'replay'
let liveSessionId = null;
let liveEventSource = null;
let pollInterval = null;
let lastEventId = 0;

// Progress panel state — metadata is emitted in pieces across events
// (total_stories in one, epic in another, story_index in a third), so we
// merge everything into a single object and re-render from it.
let progressState = {};
let sessionStartMs = null;
let elapsedTicker = null;

// ── DOM refs ──
const terminal = document.getElementById('terminal');
const terminalEmpty = document.getElementById('terminalEmpty');
const sessionSelect = document.getElementById('sessionSelect');
const liveBadge = document.getElementById('liveBadge');
const modeTag = document.getElementById('modeTag');
const progressPosition = document.getElementById('progressPosition');
const headerStatus = document.getElementById('headerStatus');

// ── Helpers ──
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function classifyLine(text) {
  const lower = text.toLowerCase();
  if (lower.includes('error') || lower.includes('failed') || lower.includes('traceback')) return 'line-error';
  if (lower.includes('completed') || lower.includes('passed') || lower.includes('success')) return 'line-success';
  if (lower.includes('stage:') || lower.includes('>>>') || lower.includes('===')) return 'line-stage';
  return 'line-log';
}

const MAX_TERMINAL_LINES = 2000;

function appendLine(text, eventType) {
  terminalEmpty.style.display = 'none';
  const span = document.createElement('span');
  span.className = 'line';
  if (eventType === 'stage') {
    span.className += ' line-stage';
  } else if (eventType === 'error') {
    span.className += ' line-error';
  } else {
    span.className += ' ' + classifyLine(text);
  }
  span.textContent = text + '\n';
  terminal.appendChild(span);
  // Trim oldest lines to keep DOM size bounded
  while (terminal.children.length > MAX_TERMINAL_LINES + 1) {
    const first = terminal.firstElementChild;
    if (first && first !== terminalEmpty) terminal.removeChild(first);
    else break;
  }
  terminal.scrollTop = terminal.scrollHeight;
}

function clearTerminal() {
  terminal.innerHTML = '';
  terminalEmpty.style.display = 'flex';
  terminal.appendChild(terminalEmpty);
}

function setMode(mode) {
  currentMode = mode;
  if (mode === 'live') {
    liveBadge.classList.add('active');
    modeTag.textContent = 'LIVE';
    modeTag.className = 'tag tag-live';
  } else if (mode === 'replay') {
    liveBadge.classList.remove('active');
    modeTag.textContent = 'REPLAY';
    modeTag.className = 'tag tag-replay';
  } else {
    liveBadge.classList.remove('active');
    modeTag.textContent = '';
    modeTag.className = 'tag';
  }
}

// ── Parse SSE data (may be JSON with metadata or plain text) ──
function parseEventData(raw) {
  try {
    const parsed = JSON.parse(raw);
    if (parsed.text !== undefined) return parsed;
  } catch {}
  return { text: raw, metadata: null };
}

// ── Progress panel ──
function formatElapsed(ms) {
  if (ms == null || ms < 0) return '—';
  const s = Math.floor(ms / 1000);
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60);
  if (m < 60) return m + 'm ' + (s % 60) + 's';
  const h = Math.floor(m / 60);
  return h + 'h ' + (m % 60) + 'm';
}

function renderProgress() {
  // Position headline (full text) inside the progress panel
  const parts = [];
  if (progressState.epic) parts.push(escapeHtml(progressState.epic));
  if (progressState.story) parts.push(escapeHtml(progressState.story));
  if (parts.length > 0) {
    progressPosition.innerHTML = parts.join(' &mdash; ');
  } else {
    progressPosition.textContent = currentMode === 'idle' ? 'Waiting for pipeline...' : 'Starting...';
  }

  // Header-centre status — compact version of the same info.
  // Format: [EPIC 6]  6-3: Suggested Decomposition List & ...
  renderHeaderStatus();

  // Progress bar — needs both total_stories and story_index, from the merged state
  const total = progressState.total_stories;
  const idx = progressState.story_index;
  if (total > 0 && idx !== undefined) {
    const pct = Math.min(100, (idx / total) * 100);
    document.getElementById('rebuildProgress').style.width = pct + '%';
  }

  // "Story X of Y" counter
  const countEl = document.getElementById('progressCount');
  if (total > 0 && idx !== undefined) {
    countEl.textContent = 'Story ' + (idx + 1) + ' of ' + total;
  } else if (total > 0) {
    countEl.textContent = total + ' stories';
  } else {
    countEl.innerHTML = '&mdash;';
  }

  // Elapsed time
  const elapsedEl = document.getElementById('progressElapsed');
  if (sessionStartMs) {
    elapsedEl.textContent = formatElapsed(Date.now() - sessionStartMs);
  } else {
    elapsedEl.innerHTML = '&mdash;';
  }
}

function renderHeaderStatus() {
  // Parse "Epic 6: Name" and "Story 6-3: Name" strings out of progressState
  // into a compact two-part header pill.
  const epicStr = progressState.epic || '';
  const storyStr = progressState.story || '';
  if (!epicStr && !storyStr) {
    headerStatus.className = 'header-status empty';
    headerStatus.textContent = currentMode === 'idle'
      ? 'No active pipeline'
      : 'Starting...';
    return;
  }
  headerStatus.className = 'header-status';

  // Epic tag: strip trailing ":" and name, keep "Epic N"
  let epicTag = '';
  const epicMatch = epicStr.match(/^(Epic\s+\d+)/i);
  if (epicMatch) epicTag = epicMatch[1].toUpperCase();

  // Story text: "X-Y: Name" (drop the leading "Story " prefix)
  let storyId = '';
  let storyName = '';
  const storyMatch = storyStr.match(/^Story\s+([\w-]+):\s*(.*)$/i);
  if (storyMatch) {
    storyId = storyMatch[1];
    storyName = storyMatch[2];
  } else {
    storyName = storyStr;
  }

  const pieces = [];
  if (epicTag) {
    pieces.push('<span class="epic-tag">' + escapeHtml(epicTag) + '</span>');
  }
  if (storyId || storyName) {
    const idSpan = storyId
      ? '<span class="story-id">' + escapeHtml(storyId) + '</span>'
      : '';
    pieces.push(
      '<span class="story-text">' + idSpan + escapeHtml(storyName) + '</span>',
    );
  }
  headerStatus.innerHTML = pieces.join('');
}

function updateProgress(metadata) {
  if (!metadata) return;
  // Merge incoming fields into the persistent progressState
  for (const k of ['epic', 'story', 'story_index', 'total_stories', 'completed', 'failed', 'interventions']) {
    if (metadata[k] !== undefined) progressState[k] = metadata[k];
  }
  renderProgress();
}

function resetProgress() {
  progressState = {};
  sessionStartMs = null;
  stopElapsedTicker();
  document.getElementById('rebuildProgress').style.width = '0%';
  document.getElementById('progressCount').innerHTML = '&mdash;';
  document.getElementById('progressElapsed').innerHTML = '&mdash;';
  progressPosition.textContent = 'Waiting for pipeline...';
  renderHeaderStatus();
}

function startElapsedTicker(startIso) {
  stopElapsedTicker();
  if (startIso) {
    const parsed = Date.parse(startIso);
    if (!isNaN(parsed)) sessionStartMs = parsed;
  }
  if (!sessionStartMs) sessionStartMs = Date.now();
  renderProgress();
  elapsedTicker = setInterval(renderProgress, 1000);
}

function stopElapsedTicker() {
  if (elapsedTicker) {
    clearInterval(elapsedTicker);
    elapsedTicker = null;
  }
}

// ── Live Mode (SSE) ──
async function startLive(sessionId) {
  stopLive();
  liveSessionId = sessionId;
  clearTerminal();
  resetProgress();
  setMode('live');

  // Grab the session start time so the elapsed counter is accurate across
  // reloads (rather than counting from when the tab opened).
  try {
    const ar = await fetch(API + '/api/active');
    const ad = await ar.json();
    const started = ad.active && ad.active.session_id === sessionId ? ad.active.started_at : null;
    startElapsedTicker(started);
  } catch {
    startElapsedTicker(null);
  }

  // Fetch recent tail for backfill instead of streaming all history
  try {
    const r = await fetch(API + '/api/logs/' + sessionId);
    const d = await r.json();
    // Show only the last 200 events for backfill
    const tail = d.events.slice(-200);
    for (const ev of tail) {
      if (ev.event_type === 'stage') {
        appendLine('>>> STAGE: ' + ev.text, 'stage');
      } else {
        appendLine(ev.text, ev.event_type);
      }
      if (ev.metadata) updateProgress(ev.metadata);
      lastEventId = ev.id;
    }
    // Also scan all metadata events for stats (progress, counts)
    for (const ev of d.events) {
      if (ev.metadata && Object.keys(ev.metadata).length > 0) updateProgress(ev.metadata);
      lastEventId = ev.id;
    }
  } catch (e) {
    appendLine('Backfill failed, streaming from now...', 'error');
  }

  // Connect SSE starting after the last backfilled event
  liveEventSource = new EventSource(API + '/api/stream/' + sessionId + '?after_id=' + lastEventId);

  liveEventSource.addEventListener('log', function(e) {
    const d = parseEventData(e.data);
    appendLine(d.text, 'log');
    if (d.metadata) updateProgress(d.metadata);
    if (e.lastEventId) lastEventId = parseInt(e.lastEventId, 10);
  });

  liveEventSource.addEventListener('stage', function(e) {
    const d = parseEventData(e.data);
    appendLine('>>> STAGE: ' + d.text, 'stage');
    if (d.metadata) updateProgress(d.metadata);
    if (e.lastEventId) lastEventId = parseInt(e.lastEventId, 10);
  });

  liveEventSource.addEventListener('error_event', function(e) {
    const d = parseEventData(e.data);
    appendLine(d.text, 'error');
    if (e.lastEventId) lastEventId = parseInt(e.lastEventId, 10);
  });

  liveEventSource.addEventListener('done', function(e) {
    appendLine('\n--- Session ended ---', 'stage');
    liveEventSource.close();
    liveEventSource = null;
    setMode('idle');
    loadSessionList();
    // If a new pipeline has already started (common on Ctrl+C / --resume),
    // auto-switch to it instead of leaving the old session frozen on screen.
    setTimeout(checkForLiveSession, 3000);
  });

  liveEventSource.onerror = function() {
    // SSE connection lost — fall back to polling from where we left off
    if (liveEventSource) liveEventSource.close();
    liveEventSource = null;
    startPolling(sessionId);
  };
}

function stopLive() {
  if (liveEventSource) {
    liveEventSource.close();
    liveEventSource = null;
  }
  stopPolling();
  liveSessionId = null;
}

// ── Polling fallback ──
function startPolling(sessionId) {
  stopPolling();
  // Continue from where SSE left off (lastEventId is preserved)
  setMode('live');

  pollInterval = setInterval(async () => {
    try {
      const r = await fetch(API + '/api/logs/' + sessionId + '?after_id=' + lastEventId);
      const d = await r.json();
      for (const ev of d.events) {
        if (ev.event_type === 'stage') {
          appendLine('>>> STAGE: ' + ev.text, 'stage');
        } else {
          appendLine(ev.text, ev.event_type);
        }
        if (ev.metadata) updateProgress(ev.metadata);
      }
      if (d.latest_id > lastEventId) lastEventId = d.latest_id;

      // Check if session is still active
      const active = await fetch(API + '/api/active');
      const ad = await active.json();
      if (!ad.active || ad.active.session_id !== sessionId) {
        appendLine('\n--- Session ended ---', 'stage');
        stopPolling();
        setMode('idle');
        loadSessionList();
        setTimeout(checkForLiveSession, 3000);
      }
    } catch (e) {
      // Network error, retry on next tick
    }
  }, 2000);
}

function stopPolling() {
  if (pollInterval) {
    clearInterval(pollInterval);
    pollInterval = null;
  }
}

// ── Replay Mode ──
async function loadReplay(sessionId) {
  stopLive();
  clearTerminal();
  resetProgress();
  setMode('replay');
  appendLine('Loading session: ' + sessionId + '...', 'stage');

  try {
    const r = await fetch(API + '/api/logs/' + sessionId);
    const d = await r.json();

    clearTerminal();
    if (d.events.length === 0) {
      terminalEmpty.textContent = 'No log events found for this session.';
      terminalEmpty.style.display = 'flex';
      return;
    }

    for (const ev of d.events) {
      if (ev.event_type === 'stage') {
        appendLine('>>> STAGE: ' + ev.text, 'stage');
      } else {
        appendLine(ev.text, ev.event_type);
      }
      if (ev.metadata) updateProgress(ev.metadata);
    }
  } catch (e) {
    appendLine('Failed to load session: ' + e.message, 'error');
  }
}

// ── Session List ──
async function loadSessionList() {
  try {
    const r = await fetch(API + '/api/sessions');
    const sessions = await r.json();
    const current = sessionSelect.value;

    // Keep the first placeholder option
    sessionSelect.innerHTML = '<option value="">-- select session --</option>';

    for (const s of sessions) {
      const opt = document.createElement('option');
      opt.value = s.session_id;
      const date = s.started_at ? new Date(s.started_at).toLocaleString() : 'unknown';
      const status = s.status === 'running' ? ' [LIVE]' : '';
      opt.textContent = date + ' (' + s.pipeline_type + ')' + status + ' — ' + s.event_count + ' events';
      if (s.session_id === current) opt.selected = true;
      sessionSelect.appendChild(opt);
    }

    // When we're idle, auto-pick-up any newly-started live session.
    // This covers the Ctrl+C / restart flow where the old SSE closes before
    // the new run has registered — the first checkForLiveSession call may
    // miss it, but this runs every 15s so it'll catch up within one tick.
    if (currentMode === 'idle') {
      const liveSession = sessions.find(s => s.status === 'running');
      if (liveSession) {
        sessionSelect.value = liveSession.session_id;
        startLive(liveSession.session_id);
      }
    }
  } catch (e) {
    // Silently fail — sessions list is non-critical
  }
}

sessionSelect.addEventListener('change', function() {
  const sessionId = this.value;
  if (!sessionId) {
    stopLive();
    clearTerminal();
    resetProgress();
    setMode('idle');
    return;
  }
  // Check if this is the active session
  fetch(API + '/api/active').then(r => r.json()).then(d => {
    if (d.active && d.active.session_id === sessionId) {
      startLive(sessionId);
    } else {
      loadReplay(sessionId);
    }
  }).catch(() => {
    loadReplay(sessionId);
  });
});

// ── Auto-detect live session on load ──
async function checkForLiveSession() {
  try {
    const r = await fetch(API + '/api/active');
    const d = await r.json();
    if (d.active) {
      sessionSelect.value = d.active.session_id;
      startLive(d.active.session_id);
    }
  } catch (e) {
    // No active session or server not reachable
  }
}

// ── Health Check ──
async function checkHealth() {
  const badge = document.getElementById('healthBadge');
  const text = document.getElementById('healthText');
  try {
    const r = await fetch(API + '/health', { signal: AbortSignal.timeout(5000) });
    const d = await r.json();
    if (d.status === 'ok') {
      badge.className = 'health-badge ok';
      text.textContent = 'SYSTEM HEALTH';
    } else {
      badge.className = 'health-badge error';
      text.textContent = 'Degraded';
    }
  } catch {
    badge.className = 'health-badge error';
    text.textContent = 'Offline';
  }
}

// ── Init ──
checkHealth();
setInterval(checkHealth, 30000);
loadSessionList();
setInterval(loadSessionList, 15000);
checkForLiveSession();
</script>
