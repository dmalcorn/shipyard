services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chat2bpmn_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  rebuild:
    build:
      context: .
      dockerfile: Dockerfile.rebuild
    volumes:
      # Mount the target project into the container
      - ${TARGET_DIR:?Set TARGET_DIR to the project path to rebuild}:/app/workspace
      # Mount Claude CLI config dir so spawned agents authenticate via OAuth.
      # NOT read-only: CLI needs to refresh expired OAuth tokens during long runs.
      # Use Windows-style path — Git Bash's /c/Users/... doesn't work with Docker.
      - C:\Users\diane\.claude:/root/.claude
    env_file:
      - .env
    environment:
      # Local Postgres for tests — overrides any DATABASE_URL in .env
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/chat2bpmn_test
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app/shipyard
    stdin_open: true
    tty: true
    stop_grace_period: 30m
